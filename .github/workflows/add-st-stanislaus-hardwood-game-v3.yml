name: Add St Stanislaus Hardwood Classic game v3

on:
  push:
    paths:
      - '.github/workflows/add-st-stanislaus-hardwood-game-v3.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update basketball archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, json

          p=Path('basketball-sync-data.json'); data=json.loads(p.read_text()); games=data['games']
          if not any(g['season']=='2004–05' and g['opponent']=='St. Stanislaus' for g in games):
              g={'season':'2004–05','display_date':'Dec. 28, 2004 report','source_date':'2004-12-28','opponent':'St. Stanislaus','points':'13','result':'W, 65–48','note':'Hardwood Classic first round in Gulfport, Mississippi. The final score is reconstructed from the article’s stated 31–24 halftime score, 10–16 third quarter and 24–8 fourth quarter. Patterson advanced to face Archbishop Rummel.','source':'Archived newspaper report (Newspapers.com)','page':'—','coverage':'Hardwood Classic first round vs. St. Stanislaus in Gulfport, Mississippi','fact':'Murphy Skinner scored 13 points; Raylon May scored 17 and Warrell Span 15. Patterson advanced in the winner’s bracket to face Archbishop Rummel. The article’s scoring progression yields a 65–48 Patterson victory.','evidence':'sources/2004-12-28-hardwood-classic-st-stanislaus-patterson.html'}
              i=next(i for i,x in enumerate(games) if x['season']=='2004–05' and x['opponent']=='Rummel'); games.insert(i,g); p.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n')

          p=Path('scripts/sync_basketball_archive.py'); s=p.read_text()
          for a,b in [
            ('assert len(sr) == 15 and point_bounds(sr) == (221,222)','assert len(sr) == 16 and point_bounds(sr) == (234,235)'),
            ('221–222</div><strong>Points documented</strong><p class="small">Across 15 currently located senior-season game reports','234–235</div><strong>Points documented</strong><p class="small">Across 16 currently located senior-season game reports'),
            ('The 221–222 points shown here cover 15 located game reports','The 234–235 points shown here cover 16 located game reports'),
            ('221–222 points across 15 currently located game reports','234–235 points across 16 currently located game reports'),
            ('senior 15 games/221–222 points.','senior 16 games/234–235 points.')]:
              if a not in s: raise SystemExit('sync text missing: '+a[:80])
              s=s.replace(a,b,1)
          p.write_text(s)

          p=Path('murphy-skinner-basketball-stats.csv'); rows=list(csv.reader(io.StringIO(p.read_text())))
          if not any(len(r)>2 and r[0]=='2004-05' and r[2]=='St. Stanislaus' for r in rows[1:]):
              nr=['2004-05','2004-12-27','St. Stanislaus','13','65','48','Win','Hardwood Classic first-round victory in Gulfport, Mississippi; advanced to face Archbishop Rummel','Archived newspaper report dated Dec. 28, 2004; Murphy Skinner scored 13. Final score 65-48 is reconstructed from the article’s stated scoring progression; exact publication/page are cropped in the recovered screenshot.']
              i=next(i for i,r in enumerate(rows) if len(r)>2 and r[0]=='2004-05' and r[2]=='Rummel'); rows.insert(i,nr); out=io.StringIO(); csv.writer(out,lineterminator='\n').writerows(rows); p.write_text(out.getvalue())

          p=Path('README.md'); r=p.read_text()
          r=r.replace('- **15 currently located game reports**','- **16 currently located game reports**',1)
          r=r.replace('- **221–222 documented points**','- **234–235 documented points**',1)
          p.write_text(r)

          p=Path('sources/2004-12-28-hardwood-classic-st-stanislaus-patterson.html')
          if not p.exists():
              p.write_text('''<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murphy Skinner — 13 points vs. St. Stanislaus, 2004 Hardwood Classic</title><meta name="robots" content="index,follow"><style>body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1220;color:#f6f8fb;line-height:1.65}main{max-width:850px;margin:auto;padding:52px 22px}a{color:#8ecae6}.card{background:#111c30;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:24px}.gold{color:#f2c14e}</style></head><body><main><p><a href="../basketball.html">← Back to Basketball Archive</a></p><div class="card"><h1 class="gold">2004 Hardwood Classic — Patterson vs. St. Stanislaus</h1><p>An archived newspaper report dated <strong>Tuesday, December 28, 2004</strong> documents Patterson's first-round Hardwood Classic game in Gulfport, Mississippi.</p><ul><li><strong>Murphy Skinner: 13 points</strong></li><li>Raylon May: 17 points</li><li>Warrell Span: 15 points</li><li>Patterson advanced in the winner's bracket to face Archbishop Rummel.</li></ul><p>The story states Patterson led 31–24 at halftime, was outscored 16–10 in the third quarter, and closed with a 24–8 fourth quarter. Those figures produce a <strong>65–48 Patterson victory</strong>.</p><p><strong>Source status:</strong> The publication date is visible in the recovered Newspapers.com screenshot. The publication name and page number are cropped, so the archive does not guess them.</p><p><strong>All-Tournament note:</strong> This report verifies Skinner's 13-point first-round performance, but it does not itself verify the All-Tournament Team selection. That honor remains a separate source target.</p></div></main></body></html>''')
          PY
          python scripts/sync_basketball_archive.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball-sync-data.json scripts/sync_basketball_archive.py murphy-skinner-basketball-stats.csv README.md index.html basketball.html sources/2004-12-28-hardwood-classic-st-stanislaus-patterson.html
          git commit -m "Add 13-point St. Stanislaus Hardwood Classic game"
          git push
