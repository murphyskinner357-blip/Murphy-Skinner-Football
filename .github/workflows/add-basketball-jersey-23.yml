name: Add basketball jersey number 23

on:
  push:
    paths:
      - '.github/workflows/add-basketball-jersey-23.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add No. 23 to basketball archive
        run: |
          python - <<'PY'
          from pathlib import Path

          # Basketball page: make jersey number visible near the top and in both season headings.
          p = Path('basketball.html')
          s = p.read_text()
          s = s.replace(
              '<div class="eyebrow">Patterson High School · Patterson, Louisiana</div><h1>Murphy Skinner<br>Basketball Archive</h1><p class="lead">',
              '<div class="eyebrow">Patterson High School · Patterson, Louisiana · Basketball No. 23</div><h1>Murphy Skinner<br>Basketball Archive</h1><p class="lead"><strong>Jersey No. 23</strong> · ',
              1
          )
          s = s.replace('2003–04 · Junior season · reconstruction in progress', '2003–04 · Junior season · No. 23 · reconstruction in progress', 1)
          s = s.replace('2004–05 · Senior season · reconstruction in progress', '2004–05 · Senior season · No. 23 · reconstruction in progress', 1)
          s = s.replace('"description":"A newspaper-sourced historical record of Murphy Skinner\'s Patterson High School basketball career."', '"description":"A newspaper-sourced historical record of Murphy Skinner\'s Patterson High School basketball career as No. 23."', 1)
          p.write_text(s)

          # Main site basketball section: add No. 23 to season cards and a visible jersey note.
          p = Path('index.html')
          s = p.read_text()
          anchor = '<section id="basketball"><div class="wrap"><h2>Patterson High basketball archive</h2>'
          if anchor in s and 'Basketball jersey: No. 23' not in s:
              s = s.replace(anchor, anchor + '<p class="lead"><strong>Basketball jersey: No. 23.</strong></p>', 1)
          s = s.replace('<div class="eyebrow">2003–04 · Junior</div>', '<div class="eyebrow">2003–04 · Junior · No. 23</div>', 1)
          s = s.replace('<div class="eyebrow">2004–05 · Senior</div>', '<div class="eyebrow">2004–05 · Senior · No. 23</div>', 1)
          p.write_text(s)

          # Keep future basketball resyncs from removing the jersey number.
          p = Path('scripts/sync_basketball_archive.py')
          s = p.read_text()
          s = s.replace('2003–04 · Junior season · reconstruction in progress', '2003–04 · Junior season · No. 23 · reconstruction in progress')
          s = s.replace('2004–05 · Senior season · reconstruction in progress', '2004–05 · Senior season · No. 23 · reconstruction in progress')
          s = s.replace('2003–04 · Junior</div>', '2003–04 · Junior · No. 23</div>')
          s = s.replace('2004–05 · Senior</div>', '2004–05 · Senior · No. 23</div>')
          p.write_text(s)

          # README summary.
          p = Path('README.md')
          s = p.read_text()
          marker = '### 2003–04 junior season\n'
          if marker in s and '**Basketball jersey:** No. 23' not in s:
              s = s.replace(marker, '**Basketball jersey:** No. 23\n\n' + marker, 1)
          p.write_text(s)
          PY
      - name: Commit jersey number update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball.html index.html scripts/sync_basketball_archive.py README.md
          git commit -m "Show basketball jersey No. 23 across site"
          git push
