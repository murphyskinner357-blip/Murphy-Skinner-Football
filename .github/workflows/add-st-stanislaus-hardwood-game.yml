name: Add St Stanislaus Hardwood Classic game

on:
  push:
    paths:
      - '.github/workflows/add-st-stanislaus-hardwood-game.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add recovered St. Stanislaus game and resync basketball archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, json

          data_path = Path('basketball-sync-data.json')
          data = json.loads(data_path.read_text())
          games = data['games']
          if not any(g.get('season') == '2004–05' and g.get('opponent') == 'St. Stanislaus' for g in games):
              game = {
                  'season':'2004–05',
                  'display_date':'Dec. 28, 2004 report',
                  'source_date':'2004-12-28',
                  'opponent':'St. Stanislaus',
                  'points':'13',
                  'result':'W, 65–48',
                  'note':'Hardwood Classic first round in Gulfport, Mississippi. The final score is reconstructed from the article’s stated 31–24 halftime score, 10–16 third quarter and 24–8 fourth quarter. Patterson advanced to face Archbishop Rummel.',
                  'source':'Archived newspaper report (Newspapers.com)',
                  'page':'—',
                  'coverage':'Hardwood Classic first round vs. St. Stanislaus in Gulfport, Mississippi',
                  'fact':'Murphy Skinner scored 13 points; Raylon May scored 17 and Warrell Span 15. Patterson advanced in the winner’s bracket to face Archbishop Rummel. The article’s scoring progression yields a 65–48 Patterson victory.',
                  'evidence':'sources/2004-12-28-hardwood-classic-st-stanislaus-patterson.html'
              }
              idx = next(i for i,g in enumerate(games) if g.get('season') == '2004–05' and g.get('opponent') == 'Rummel')
              games.insert(idx, game)
              data_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',',':')) + '\n')

          script_path = Path('scripts/sync_basketball_archive.py')
          s = script_path.read_text()
          replacements = {
              'assert len(sr) == 15 and point_bounds(sr) == (221,222)':'assert len(sr) == 16 and point_bounds(sr) == (234,235)',
              '221–222 points shown here cover 15 located game reports':'234–235 points shown here cover 16 located game reports',
              '221–222</div><strong>Points documented</strong><p class="small">Across 15 currently located senior-season game reports':'234–235</div><strong>Points documented</strong><p class="small">Across 16 currently located senior-season game reports',
              '221–222 points across 15 currently located game reports':'234–235 points across 16 currently located game reports',
              'Version 5.4 · September 2, 2026":"Version 5.5 · September 2, 2026':'Version 5.5 · September 2, 2026":"Version 5.6 · September 2, 2026',
              "re.sub(r'Version 2\\.\\d+','Version 3.0',s,count=1)":"re.sub(r'Version 3\\.0','Version 3.1',s,count=1)",
              'senior 15 games/221–222 points.':'senior 16 games/234–235 points.'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected sync-script text: {old}')
              s = s.replace(old,new,1)
          script_path.write_text(s)

          csv_path = Path('murphy-skinner-basketball-stats.csv')
          rows = list(csv.reader(io.StringIO(csv_path.read_text())))
          if not any(len(r) > 2 and r[0] == '2004-05' and r[2] == 'St. Stanislaus' for r in rows[1:]):
              newrow = ['2004-05','2004-12-27','St. Stanislaus','13','65','48','Win','Hardwood Classic first-round victory in Gulfport, Mississippi; advanced to face Archbishop Rummel','Archived newspaper report dated Dec. 28, 2004; Murphy Skinner scored 13. Final score 65-48 is reconstructed from the article’s stated halftime and second-half scoring progression; exact publication/page are cropped in the recovered screenshot.']
              insert_at = next(i for i,r in enumerate(rows) if len(r)>2 and r[0]=='2004-05' and r[2]=='Rummel')
              rows.insert(insert_at,newrow)
              out = io.StringIO(); w=csv.writer(out, lineterminator='\n'); w.writerows(rows); csv_path.write_text(out.getvalue())

          readme = Path('README.md')
          r = readme.read_text()
          marker = '- **January 2005 vs. Jeanerette:** 11 points in Patterson\'s 73–70 non-district win\n'
          add = '- **December 2004 vs. St. Stanislaus:** 13 points in a first-round Hardwood Classic victory in Gulfport, Mississippi; Patterson advanced to face Archbishop Rummel\n- **December 2004 vs. Rummel:** 14 points in the Hardwood Club Holiday Classic semifinal comeback\n'
          if 'vs. St. Stanislaus' not in r:
              # place after the November Terrebonne line and before January entries
              anchor = '- **November 2004 vs. Terrebonne:** Patterson won 77–74 in overtime; *The Courier* reports 15 points while *The Daily Review* reports 16, so the archive preserves the source conflict\n'
              if anchor not in r: raise SystemExit('README anchor not found')
              r = r.replace(anchor, anchor + add, 1)
          readme.write_text(r)

          src = Path('sources/2004-12-28-hardwood-classic-st-stanislaus-patterson.html')
          if not src.exists():
              src.write_text('''<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murphy Skinner — 13 points vs. St. Stanislaus, 2004 Hardwood Classic</title><meta name="robots" content="index,follow"><style>body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1220;color:#f6f8fb;line-height:1.65}main{max-width:850px;margin:auto;padding:52px 22px}a{color:#8ecae6}.card{background:#111c30;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:24px}.gold{color:#f2c14e}</style></head><body><main><p><a href="../basketball.html">← Back to Basketball Archive</a></p><div class="card"><h1 class="gold">2004 Hardwood Classic — Patterson vs. St. Stanislaus</h1><p>An archived newspaper report dated <strong>Tuesday, December 28, 2004</strong> documents Patterson's first-round Hardwood Classic game in Gulfport, Mississippi.</p><ul><li><strong>Murphy Skinner: 13 points</strong></li><li>Raylon May: 17 points</li><li>Warrell Span: 15 points</li><li>Patterson advanced in the winner's bracket to face Archbishop Rummel.</li></ul><p>The story states Patterson led 31–24 at halftime, was outscored 16–10 in the third quarter, and closed with a 24–8 fourth quarter. Those stated period totals produce a <strong>65–48 Patterson victory</strong>.</p><p><strong>Source status:</strong> The publication date is visible in the recovered Newspapers.com screenshot. The publication name and page number are cropped in the supplied image, so the archive does not guess them.</p><p><strong>All-Tournament note:</strong> This report verifies Skinner's 13-point first-round performance, but it does not itself verify the All-Tournament Team selection. That honor remains a separate source target.</p></div></main></body></html>''')
          PY
          python scripts/sync_basketball_archive.py
      - name: Commit recovered tournament game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball-sync-data.json scripts/sync_basketball_archive.py murphy-skinner-basketball-stats.csv README.md index.html basketball.html sources/2004-12-28-hardwood-classic-st-stanislaus-patterson.html
          git commit -m "Add 13-point St. Stanislaus Hardwood Classic game"
          git push
