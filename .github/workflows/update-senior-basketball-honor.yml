name: Publish basketball archive updates

on:
  push:
    paths:
      - '.github/workflows/update-senior-basketball-honor.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Feb. 2005 West St. Mary game
        run: |
          python - <<'PY'
          from pathlib import Path

          # Main athletic archive
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('187–188 points across 13 currently located game reports', '207–208 points across 14 currently located game reports', 1)

          anchor = '<tr><td>2004–05</td><td>Feb. 8, 2005 source</td><td>Franklin</td><td>W, 80–79</td><td><strong>13 points</strong></td>'
          newrow = '<tr><td>2004–05</td><td>Feb. 7, 2005</td><td>West St. Mary</td><td>W, 66–59</td><td><strong>20 points</strong></td><td>Skinner and Warrell Span scored 20 points apiece as Patterson moved into first place in District 7-3A. Skinner made two three-pointers. Patterson improved to 21–8 overall and 4–1 in district play.</td></tr>\n      '
          if newrow not in s:
              if anchor not in s:
                  raise SystemExit('Main game-table anchor not found')
              s = s.replace(anchor, newrow + anchor, 1)

          source_anchor = '<tr><td>2005-02-08</td><td>The Daily Review</td><td>9</td><td>Patterson 80, Franklin 79</td>'
          source_row = '<tr><td>2005-02-07</td><td>The Daily Review</td><td>—</td><td>\'Jacks take over first in 7-3A</td><td>Patterson defeated West St. Mary 66–59. Murphy Skinner and Warrell Span scored 20 points apiece; Skinner made two three-pointers. Patterson improved to 21–8 overall and 4–1 in District 7-3A and moved into first place.</td></tr>\n      '
          if source_row not in s:
              if source_anchor not in s:
                  raise SystemExit('Main source-register anchor not found')
              s = s.replace(source_anchor, source_row + source_anchor, 1)

          s = s.replace('Version 5.3 · September 2, 2026', 'Version 5.4 · September 2, 2026', 1)
          p.write_text(s)

          # Basketball-specific archive
          p = Path('basketball.html')
          s = p.read_text()
          s = s.replace('<div class="card"><div class="stat">126–127</div><strong>Points documented</strong><p class="small">Across 8 recovered senior-season games; the range reflects a one-point source conflict.</p></div>', '<div class="card"><div class="stat">146–147</div><strong>Points documented</strong><p class="small">Across 9 recovered senior-season games; the range reflects a one-point source conflict.</p></div>', 1)
          s = s.replace('The 126–127 points shown here cover eight recovered games', 'The 146–147 points shown here cover nine recovered games', 1)

          anchor = '<tr><td>Franklin</td><td><strong>13</strong></td><td>Patterson 80, Franklin 79</td>'
          newrow = '<tr><td>West St. Mary</td><td><strong>20</strong></td><td>Patterson 66, West St. Mary 59</td><td><em>The Daily Review</em>, Feb. 7, 2005. Skinner and Warrell Span scored 20 points apiece as Patterson moved into first place in District 7-3A; Skinner made two three-pointers. Patterson improved to 21–8 overall and 4–1 in district play.</td></tr>\n'
          if newrow not in s:
              if anchor not in s:
                  raise SystemExit('Basketball page game-table anchor not found')
              s = s.replace(anchor, newrow + anchor, 1)

          source_anchor = '<tr><td>2004-11-16</td><td>The Daily Review</td><td>9</td><td>Patterson 77, Terrebonne 74 (OT): reports Murphy Skinner scored 16 points.</td></tr>'
          source_row = '<tr><td>2005-02-07</td><td>The Daily Review</td><td>—</td><td>Patterson 66, West St. Mary 59: Murphy Skinner and Warrell Span scored 20 points apiece. Skinner hit two three-pointers as Patterson moved into first place in District 7-3A at 21–8 overall and 4–1 in district.</td></tr>\n'
          if source_row not in s:
              if source_anchor not in s:
                  raise SystemExit('Basketball source-register anchor not found')
              s = s.replace(source_anchor, source_anchor + '\n' + source_row, 1)
          p.write_text(s)

          # Machine-readable basketball stats
          p = Path('murphy-skinner-basketball-stats.csv')
          s = p.read_text()
          row = '2004-05,2005-02-04,West St. Mary,20,66,59,Win,"Skinner and Warrell Span scored 20 points apiece; Patterson moved into first place in District 7-3A at 21-8 overall and 4-1 in district","The Daily Review dated 2005-02-07 reports the Friday-night game; Skinner made two three-pointers; game date is inferred as 2005-02-04"\n'
          if row not in s:
              marker = '2004-05,,Franklin,13,80,79,Win,'
              pos = s.find(marker)
              if pos == -1:
                  raise SystemExit('CSV insertion anchor not found')
              s = s[:pos] + row + s[pos:]
          p.write_text(s)
          PY
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html basketball.html murphy-skinner-basketball-stats.csv
          git commit -m "Add 20-point West St. Mary game from Feb. 2005"
          git push
