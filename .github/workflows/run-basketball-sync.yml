name: Reconcile basketball archive

on:
  push:
    paths:
      - '.github/workflows/run-basketball-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run basketball archive sync
        run: python scripts/sync_basketball_archive.py
      - name: Commit reconciled archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html basketball.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Reconcile basketball archive pages"
            git push
          fi
